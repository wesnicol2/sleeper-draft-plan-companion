name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format

      - name: Commit exact formatter output
        run: |
          if ! git diff --quiet -- '*.py'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sleeper_draft_plan_companion/*.py tests/*.py
            git commit -m "Apply exact Ruff formatting [skip ci]"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
