name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format

      - name: Upload formatted Python
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-python
          path: |
            sleeper_draft_plan_companion/*.py
            tests/*.py

      - name: Verify formatter was clean
        run: git diff --exit-code -- '*.py'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
