<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft Plan Companion</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <header>
    <h1>Draft Plan Companion</h1>
    <p class="tagline">Second-screen companion for a live Sleeper draft.</p>
  </header>

  <main>
    <!-- The board is the app; everything under .diagnostics is there to explain
         the board when it looks wrong. All of it is driven by the poll in
         script.js so the page never needs interaction. -->
    <section class="card board">
      <div class="cardhead">
        <h2>Board</h2>
        <span class="muted" id="boardMeta">&nbsp;</span>
        <button id="refresh" type="button" class="refresh" title="Fetch now, ignoring the cache">
          Refresh
        </button>
      </div>
      <div id="boardGrid" class="grid"></div>
      <p class="muted" id="boardNote">&nbsp;</p>
    </section>

    <div class="diagnostics">
      <section class="card">
        <h2>Checkpoint</h2>
        <p id="cpName">—</p>
        <p class="muted" id="cpNeeds">&nbsp;</p>
        <p class="muted" id="cpGuidance">&nbsp;</p>
      </section>

      <section class="card">
        <div class="cardhead">
          <h2>Draft</h2>
        </div>
        <p id="draftHeadline">—</p>
        <p class="muted" id="draftProgress">&nbsp;</p>
        <p class="muted" id="draftNote">&nbsp;</p>
        <p id="myCounts" class="counts">&nbsp;</p>
        <ol id="recentPicks" class="picks"></ol>
      </section>

      <section class="card">
        <h2>Choose a draft</h2>
        <div id="draftList" class="draft-list muted">loading…</div>
        <div class="paste">
          <label for="draftIdInput" class="muted">Or paste a draft ID (mock drafts
            aren't listed by Sleeper):</label>
          <div class="paste-row">
            <input id="draftIdInput" type="text" inputmode="numeric"
                   placeholder="1397021212936306688" autocomplete="off">
            <button id="draftIdOpen" type="button">Open</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Player pool</h2>
        <p>Loaded: <span id="players">—</span></p>
        <p class="muted" id="positions">&nbsp;</p>
        <p class="muted">Cache age: <span id="cacheAge">—</span></p>
      </section>

      <section id="status" class="card">
        <h2>Service</h2>
        <p>Status: <span id="health" class="pill pill-unknown">checking…</span></p>
        <p class="muted">Last checked: <span id="checked">never</span></p>
      </section>
    </div>
  </main>

  <script src="/ui/script.js"></script>
</body>
</html>
